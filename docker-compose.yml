services:

  postgres:
    image: postgres:17-alpine
    container_name: sih26155-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-security_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-security_auditor} -d ${POSTGRES_DB:-security_auditor}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: sih26155-backend
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME:-SIH 26155 Network Security Compliance Auditor}
      APP_ENV: ${APP_ENV:-development}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      POSTGRES_DB: ${POSTGRES_DB:-security_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-security_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret_for_local_development}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-sih26155_access_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH:-/}

      ARTIFACT_STORAGE_PATH: ${ARTIFACT_STORAGE_PATH:-/app/storage/artifacts}
      REPORT_STORAGE_PATH: ${REPORT_STORAGE_PATH:-/app/storage/reports}
      ARTIFACT_MAX_UPLOAD_BYTES: ${ARTIFACT_MAX_UPLOAD_BYTES:-10485760}
      ARTIFACT_MAX_BULK_FILES: ${ARTIFACT_MAX_BULK_FILES:-20}
      AI_MAPPING_SUGGESTIONS_ENABLED: ${AI_MAPPING_SUGGESTIONS_ENABLED:-false}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    volumes:
      - ./storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: sih26155-frontend
    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    container_name: sih26155-worker
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-security_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-security_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_secret_for_local_development}
      ARTIFACT_STORAGE_PATH: ${ARTIFACT_STORAGE_PATH:-/app/storage/artifacts}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}

    volumes:
      - ./storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
