name: Repository Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: security_auditor_test
          POSTGRES_USER: security_auditor_test
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_auditor_test -d security_auditor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      POSTGRES_DB: security_auditor_test
      POSTGRES_USER: security_auditor_test
      POSTGRES_PASSWORD: ci-test-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-test-only-signing-key-at-least-32-characters
      SIH_AUTH_POSTGRES_TEST: "1"
      SIH_PERSISTENCE_POSTGRES_TEST: "1"
      SIH_JOBS_POSTGRES_TEST: "1"
      SIH_WORKER_POSTGRES_TEST: "1"
      SIH_ARISTA_POSTGRES_TEST: "1"
      SIH_ARTIFACT_POSTGRES_TEST: "1"
      SIH_B1_POSTGRES_TEST: "1"
      SIH_AUDIT_POSTGRES_TEST: "1"
      SIH_B10_POSTGRES_TEST: "1"
      SIH_TRAINING_POSTGRES_TEST: "1"
      SIH_STEP13_POSTGRES_TEST: "1"
      SIH_B6_POSTGRES_TEST: "1"
      SIH_B7_POSTGRES_TEST: "1"
      SIH_B8_POSTGRES_TEST: "1"
      SIH_B9_POSTGRES_TEST: "1"
      SIH_BATCH_AUDIT_POSTGRES_TEST: "1"
      SIH_STEP7_POSTGRES_TEST: "1"
      SIH_DASHBOARD_POSTGRES_TEST: "1"
      SIH_STEP6_POSTGRES_TEST: "1"
      SIH_STEP8_POSTGRES_TEST: "1"
      SIH_PHASE3_POSTGRES_TEST: "1"
      SIH_PHASE4_POSTGRES_TEST: "1"
      SIH_PHASE5_POSTGRES_TEST: "1"
      SIH_B2_POSTGRES_TEST: "1"
      SIH_PROFILE_POSTGRES_TEST: "1"
      SIH_STEP12_POSTGRES_TEST: "1"
      SIH_INTERPRETATION_POSTGRES_TEST: "1"
      SIH_WORKFLOW_POSTGRES_TEST: "1"
      SIH_STEP4_POSTGRES_TEST: "1"
      SIH_STEP5_POSTGRES_TEST: "1"
      SIH_T2_POSTGRES_TEST: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply and verify migrations
        run: |
          alembic -c ../database/alembic.ini upgrade head
          alembic -c ../database/alembic.ini downgrade 20260909_0020
          alembic -c ../database/alembic.ini upgrade head
          alembic -c ../database/alembic.ini heads | grep -F "20260920_0023 (head)"
          alembic -c ../database/alembic.ini current | grep -F "20260920_0023 (head)"

      - name: Run tests
        run: python -m pytest -v

      - name: Check migration drift
        run: alembic -c ../database/alembic.ini check


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint


  compose:
    name: Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

  restart-reuse:
    name: Compose Restart Reuse Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify persisted mapping reuse across service restart
        run: bash scripts/verify-compose-restart-reuse.sh

      - name: Tear down acceptance services
        if: always()
        run: docker compose down --volumes --remove-orphans
