#config-version=FGT v7.4.3
config system interface
    edit "port1"
        set allowaccess ssh https
    next
end
config system global
    set admin-ssh-port 2222
    set admin-telnet-port 2323
    set admintimeout 10
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
end
config system admin
    edit "admin"
        set trusthost1 192.0.2.0 255.255.255.0
    next
end
config log setting
    set status enable
end
config log syslogd setting
    set server "192.0.2.10"
end
config ntpserver
    edit 1
        set server "192.0.2.20"
    next
end
