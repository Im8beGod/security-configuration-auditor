! Sanitized structural fixture
hostname router01
aaa new-model
aaa authentication login default local
!
interface GigabitEthernet1/0/1
 description User Access
 switchport mode access
 spanning-tree portfast
interface GigabitEthernet1/0/2
 description Voice Access
 switchport mode access
!
line console 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 transport input ssh
!
ip ssh version 2
logging host 192.0.2.10
ntp server 192.0.2.20
snmp-server community SANITIZED RO
no ip http server
!
ip access-list extended MANAGEMENT
 permit tcp 10.0.0.0 0.0.0.255 any eq 22
 deny ip any any log
!
router ospf 1
 router-id 10.0.0.1
 passive-interface default
!
policy-map WAN-QOS
 class VOICE
  priority percent 20
!
banner motd ^C
line vty 0 4
 transport input telnet
DO NOT PARSE THIS AS CONFIG
^C
!
crypto pki certificate chain SANITIZED-CHAIN
 certificate self-signed 01
  30820000SANITIZED
  line vty 0 4
  quit
!
platform mystery-mode enabled
